name: build-and-push

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - "main"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3  # This step checkouts the code of the repository
      - name: Login to Docker Hub
        uses: docker/login-action@v2 # This step logs in to the Docker Hub using the secrets
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
            docker build --platform linux/${{ matrix.platform }} -t ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot-api:latest-${{ matrix.platform }} .
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot-api:latest-${{ matrix.platform }}
  
  create-manifest:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push Docker Manifest
        run: |
            # Define the base image name
            IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot-api
            # Define the target manifest tag
            MANIFEST_TAG=latest

            # Create the manifest list referencing the platform-specific images
            docker manifest create \
              $IMAGE_NAME:$MANIFEST_TAG \
              --amend $IMAGE_NAME:latest-amd64 \
              --amend $IMAGE_NAME:latest-arm64

            # Push the created manifest list to Docker Hub
            docker manifest push $IMAGE_NAME:$MANIFEST_TAG